# Field-mapping for the external personnel directory.
# Edit this file (no code change) to onboard a new source or adapt to a schema change.

# Dot-path to the array of records inside the HTTP response.
# Omit when the response body is already a JSON array.
recordsPath: data.units

# Dot-paths (relative to a single record) for each canonical field.
fields:
  externalId: id
  parentExternalId: parentId
  nameAr: name.ar
  nameEn: name.en
  unitType: type

# Translate the source's unit-type codes to our OrgUnitType codes.
unitTypeMap:
  UNI: UNIVERSITY
  FAC: FACULTY
  DEP: DEPARTMENT

# ---------------------------------------------------------------------------
# Employee/student feed. Optional: omit this whole block and POST /users/sync
# reports that the directory exposes no user feed, while department sync keeps
# working.
#
# Only the fields below are read. Everything else the personnel system returns
# about a person is ignored on purpose -- this system stores what its own users
# table needs and nothing more.
users:
  # Appended to PERSONNEL_DIRECTORY_URL. Omit to reuse the base URL as-is.
  endpoint: /employees

  # Dot-path to the array of records inside the HTTP response.
  recordsPath: data.employees

  fields:
    institutionalNumber: empNo
    fullNameAr: name.ar
    fullNameEn: name.en
    email: contact.email
    phone: contact.mobile
    userType: category
    # Links a person to the department tree synced above, by the SAME external
    # id the department feed uses.
    departmentExternalId: unitId

  # Translate the source's person categories to our UserType codes.
  # APPLICANT is rejected: applicants self-register and are never imported.
  userTypeMap:
    EMP: EMPLOYEE
    STU: STUDENT
